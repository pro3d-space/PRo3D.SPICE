name: Publish 
on:
  push:
    branches:
      - main
    paths:
      - RELEASE_NOTES.md 
      - .github/workflows/publish.yml
jobs:
  pack:
    name: Package
    runs-on: windows-latest
    permissions:
      id-token: write   # required for nuget.org trusted publishing (OIDC)
      contents: write   # aardpack uses GITHUB_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Dotnet
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore Tools
        run: dotnet tool restore
      - name: Restore
        run: dotnet paket restore
      - name: Build
        shell: cmd
        run: dotnet build -c Release ./PRo3D.SPICE.sln
      - name: Pack
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet aardpack ./PRo3D.SPICE.sln.sln --notag
      - name: Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: bin\pack
      # Exchange the GitHub OIDC token for a short-lived nuget.org API key.
      # Requires a Trusted Publishing policy on nuget.org for this repo+workflow.
      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}   # nuget.org profile name (the OIDC identity); package owner is set on the policy
      - name: NuGet push
        run: dotnet nuget push "bin\pack\*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source "https://api.nuget.org/v3/index.json" --skip-duplicate
